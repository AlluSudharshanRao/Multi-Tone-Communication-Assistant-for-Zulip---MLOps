[chameleon]
203.0.113.10

[chameleon:vars]
ansible_user=cc
# WSL: copy .pem to Linux home and chmod 600 — /mnt/c/... keys are often rejected by OpenSSH.
ansible_ssh_private_key_file=~/.ssh/YOUR_KEY
# Quiets interpreter discovery warnings on Ubuntu 24.04 / k3s VMs:
ansible_python_interpreter=/usr/bin/python3.12
