---
# Copies k8s/ to the VM; applies namespaces, MLflow, MinIO, and Prometheus/Grafana (monitoring).
# Runtime secrets are expected to come from Sealed Secrets via deploy_sealed_secrets.yml.
- name: Deploy namespaces + platform services (MLflow, MinIO, observability)
  hosts: control_plane
  become: true
  gather_facts: false
  vars:
    kubeconfig_path: "/home/{{ ansible_user }}/.kube/config"
    repo_root: "/opt/mlops_project"
    public_floating_ip: "{{ hostvars[groups['control_plane'][0]].ansible_host }}"
    nip_hostname_files:
      - "k8s/platform/minio/deployment.yaml"
      - "k8s/platform/minio/ingress-api.yaml"
      - "k8s/platform/minio/ingress-console.yaml"
      - "k8s/platform/mlflow/ingress.yaml"
      - "k8s/platform/observability/deployment-grafana.yaml"
      - "k8s/platform/observability/ingress-grafana.yaml"
      - "k8s/platform/observability/ingress-prometheus.yaml"
      - "k8s/zulip/values-chameleon.yaml"
    alert_email_to: "{{ lookup('env', 'ALERT_EMAIL_TO') | default('', true) }}"
    alert_email_from: "{{ lookup('env', 'ALERT_EMAIL_FROM') | default('', true) }}"
    alert_email_smarthost: "{{ lookup('env', 'ALERT_EMAIL_SMARTHOST') | default('', true) }}"
    alert_email_auth_username: "{{ lookup('env', 'ALERT_EMAIL_AUTH_USERNAME') | default('', true) }}"
    alert_email_auth_password: "{{ lookup('env', 'ALERT_EMAIL_AUTH_PASSWORD') | default('', true) }}"
  tasks:
    - name: Ensure git is installed
      ansible.builtin.package:
        name: git
        state: present

    - name: Ensure repo root directory exists
      ansible.builtin.file:
        path: "{{ repo_root }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Copy manifests to VM
      ansible.builtin.copy:
        src: "../../../k8s/"
        dest: "{{ repo_root }}/k8s/"
        mode: "0644"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Update nip.io hostnames to the current floating IP
      ansible.builtin.replace:
        path: "{{ repo_root }}/{{ item }}"
        regexp: "FLOATING_IP_PLACEHOLDER|(?<=\\.)\\d{1,3}(?:\\.\\d{1,3}){3}(?=\\.nip\\.io)"
        replace: "{{ public_floating_ip }}"
      loop: "{{ nip_hostname_files }}"

    - name: Remove obsolete flat inference manifests from VM
      ansible.builtin.file:
        path: "{{ repo_root }}/k8s/inference/{{ item }}"
        state: absent
      loop:
        - classifier-pytorch-deployment.yaml
        - classifier-pytorch-service.yaml
        - classifier-onnx-deployment.yaml
        - classifier-onnx-service.yaml
        - classifier-quantized-deployment.yaml
        - classifier-quantized-service.yaml
        - generator-deployment.yaml
        - generator-service.yaml
        - tone-generator-deployment.yaml
        - tone-generator-service.yaml

    - name: Sealed-secrets demo script executable for ansible_user
      ansible.builtin.file:
        path: "{{ repo_root }}/k8s/addons/sealed-secrets/demo/generate-sealed-demo.sh"
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Apply namespaces
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        apply -f {{ repo_root }}/k8s/base/namespaces.yaml

    - name: Apply MLflow kustomize
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        apply -k {{ repo_root }}/k8s/platform/mlflow/

    - name: Verify MinIO root secret exists (ml-platform namespace)
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        get secret minio-root -n ml-platform

    - name: Apply MinIO kustomize
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        apply -k {{ repo_root }}/k8s/platform/minio/

    - name: Verify Grafana admin secret exists (monitoring namespace)
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        get secret grafana-admin -n monitoring

    - name: Inject Alertmanager SMTP settings into observability config on VM
      ansible.builtin.replace:
        path: "{{ repo_root }}/k8s/platform/observability/configmap-alertmanager.yaml"
        regexp: "{{ item.placeholder }}"
        replace: "{{ item.value }}"
      loop:
        - { placeholder: "ALERT_EMAIL_TO", value: "{{ alert_email_to | default('', true) }}" }
        - { placeholder: "ALERT_EMAIL_FROM", value: "{{ alert_email_from | default('', true) }}" }
        - { placeholder: "ALERT_EMAIL_SMARTHOST", value: "{{ alert_email_smarthost | default('', true) }}" }
        - { placeholder: "ALERT_EMAIL_AUTH_USERNAME", value: "{{ alert_email_auth_username | default('', true) }}" }
        - { placeholder: "ALERT_EMAIL_AUTH_PASSWORD", value: "{{ alert_email_auth_password | default('', true) }}" }
      when:
        - alert_email_to | length > 0
        - alert_email_from | length > 0
        - alert_email_smarthost | length > 0
        - alert_email_auth_username | length > 0
        - alert_email_auth_password | length > 0
      no_log: true

    - name: Apply Prometheus and Grafana kustomize
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        apply -k {{ repo_root }}/k8s/platform/observability/
