---
# Copies k8s/ to the VM; applies namespaces, MLflow, MinIO, and Prometheus/Grafana (monitoring).
# Creates Secret minio-root in ml-platform using minio_root_password (see vars below).
# Creates Secret grafana-admin in monitoring with a random password (retrieve via kubectl).
# Expects k3s and ~/.kube/config from k3s_install. Repo path on VM: /opt/mlops_project.
#
# Run: ansible-playbook -i ../inventory.ini playbooks/deploy_platform.yml
# Override password without editing this file:
#   ansible-playbook ... -e minio_root_password=yourpassword
# Or set MINIO_ROOT_PASSWORD in your shell before running.
# Playbook order + dedupe policy: ../../ONE_PLATFORM_AND_CLEANUP.md
- name: Deploy namespaces + platform services (MLflow, MinIO, observability)
  hosts: chameleon
  become: true
  gather_facts: false
  vars:
    kubeconfig_path: "/home/{{ ansible_user }}/.kube/config"
    repo_root: "/opt/mlops_project"
    # MinIO root credentials — username is fixed; password can be overridden via:
    #   -e minio_root_password=<value>  OR  env var MINIO_ROOT_PASSWORD
    # Must match the MINIO_ROOT_PASSWORD set on the running MinIO Pod/deployment.
    minio_root_user: "minioadmin"
    minio_root_password: "{{ lookup('env', 'MINIO_ROOT_PASSWORD') | default('minio-password', true) }}"
    # Grafana admin credentials — override via -e grafana_admin_password=<value>
    # or env var GRAFANA_ADMIN_PASSWORD. Must match GF_SECURITY_ADMIN_PASSWORD.
    grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | default('grafana-password', true) }}"
  tasks:
    - name: Ensure git is installed
      ansible.builtin.package:
        name: git
        state: present

    - name: Ensure repo root directory exists
      ansible.builtin.file:
        path: "{{ repo_root }}"
        state: directory
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Copy manifests to VM (expects repo present locally)
      ansible.builtin.copy:
        src: "../../../k8s/"
        dest: "{{ repo_root }}/k8s/"
        mode: "0644"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    # copy does not delete stale files on the VM; old flat inference YAML (wrong images)
    # would otherwise linger next to k8s/inference/base|overlays|backends/.
    - name: Remove obsolete flat inference manifests from VM (superseded by kustomize tree)
      ansible.builtin.file:
        path: "{{ repo_root }}/k8s/inference/{{ item }}"
        state: absent
      loop:
        - classifier-pytorch-deployment.yaml
        - classifier-pytorch-service.yaml
        - classifier-onnx-deployment.yaml
        - classifier-onnx-service.yaml
        - classifier-quantized-deployment.yaml
        - classifier-quantized-service.yaml
        - generator-deployment.yaml
        - generator-service.yaml
        - tone-generator-deployment.yaml
        - tone-generator-service.yaml

    - name: Sealed-secrets demo script executable for ansible_user
      ansible.builtin.file:
        path: "{{ repo_root }}/k8s/addons/sealed-secrets/demo/generate-sealed-demo.sh"
        mode: "0755"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Apply namespaces
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        apply -f {{ repo_root }}/k8s/base/namespaces.yaml

    - name: Apply MLflow kustomize
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        apply -k {{ repo_root }}/k8s/platform/mlflow/

    - name: Ensure MinIO root secret exists (ml-platform namespace)
      ansible.builtin.shell: |
        set -e
        # Use --dry-run=client | apply so re-running updates the secret if the password changed.
        kubectl --kubeconfig {{ kubeconfig_path }} create secret generic minio-root -n ml-platform \
          --from-literal=root-user={{ minio_root_user }} \
          --from-literal=root-password={{ minio_root_password }} \
          --dry-run=client -o yaml | \
        kubectl --kubeconfig {{ kubeconfig_path }} apply -f -
      args:
        executable: /bin/bash
      no_log: true

    - name: Apply MinIO kustomize
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        apply -k {{ repo_root }}/k8s/platform/minio/

    - name: Ensure Grafana admin secret exists (monitoring namespace)
      ansible.builtin.shell: |
        set -e
        kubectl --kubeconfig {{ kubeconfig_path }} create secret generic grafana-admin -n monitoring \
          --from-literal=admin-password={{ grafana_admin_password }} \
          --dry-run=client -o yaml | \
        kubectl --kubeconfig {{ kubeconfig_path }} apply -f -
      args:
        executable: /bin/bash
      no_log: true

    - name: Apply Prometheus and Grafana kustomize
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        apply -k {{ repo_root }}/k8s/platform/observability/

