---
# Installs Helm if missing, then helm upgrade --install for docker-zulip chart.
- name: Deploy Zulip via Helm chart (docker-zulip)
  hosts: control_plane
  become: true
  gather_facts: false
  vars:
    kubeconfig_path: "/home/{{ ansible_user }}/.kube/config"
    public_floating_ip: "{{ hostvars[groups['control_plane'][0]].ansible_host }}"
    zulip_external_host: "zulip.{{ public_floating_ip }}.nip.io"
    project_id_suffix: "proj15"
    release_name: "zulip-{{ project_id_suffix }}"
    zulip_k8s_namespace: "zulip"
    zulip_chart_dir: ""
    zulip_values_file: ""
    zulip_secret_values_file: ""
  tasks:
    - name: Fail if zulip_chart_dir not provided
      ansible.builtin.fail:
        msg: "Clone https://github.com/zulip/docker-zulip and pass -e zulip_chart_dir=/path/to/docker-zulip/helm/zulip"
      when: zulip_chart_dir | length == 0

    - name: Check whether Helm is installed
      ansible.builtin.command: helm version
      register: helm_check
      failed_when: false
      changed_when: false

    - name: Install Helm 3 (upstream install script)
      when: helm_check.rc != 0
      ansible.builtin.shell: |
        set -e
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        executable: /bin/bash

    - name: Verify Helm after install
      ansible.builtin.command: helm version

    - name: Ensure namespace exists
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        create namespace {{ zulip_k8s_namespace }}
      register: ns_create
      failed_when: ns_create.rc != 0 and ("AlreadyExists" not in (ns_create.stderr | default("")))

    - name: Check if Zulip chart directory exists on the VM
      ansible.builtin.stat:
        path: "{{ zulip_chart_dir }}"
      register: zulip_chart_stat

    - name: Clone docker-zulip chart source (if chart path missing)
      when: not zulip_chart_stat.stat.exists
      become_user: "{{ ansible_user }}"
      ansible.builtin.git:
        repo: https://github.com/zulip/docker-zulip.git
        dest: "{{ zulip_chart_dir | dirname | dirname }}"
        depth: 1

    - name: Update SETTING_EXTERNAL_HOST in Zulip secret values
      ansible.builtin.shell: |
        python3 - <<'PY'
        from pathlib import Path
        import re

        path = Path("{{ zulip_secret_values_file }}")
        data = path.read_bytes()
        updated = re.sub(
            br'SETTING_EXTERNAL_HOST:\s*".*"',
            b'SETTING_EXTERNAL_HOST: "{{ zulip_external_host }}"',
            data,
        )
        if updated != data:
            path.write_bytes(updated)
        PY
      args:
        executable: /bin/bash
      when: zulip_secret_values_file | length > 0

    - name: Normalize Zulip secret values file to UTF-8 for Helm
      ansible.builtin.shell: |
        python3 - <<'PY'
        from pathlib import Path

        path = Path("{{ zulip_secret_values_file }}")
        raw = path.read_bytes()
        for encoding in ("utf-8", "cp1252", "latin-1"):
            try:
                text = raw.decode(encoding)
                break
            except UnicodeDecodeError:
                continue
        else:
            raise RuntimeError(f"Unable to decode {path}")
        path.write_text(text, encoding="utf-8", newline="\n")
        PY
      args:
        executable: /bin/bash
      when: zulip_secret_values_file | length > 0

    - name: Update chart dependencies
      ansible.builtin.command: helm dependency update {{ zulip_chart_dir }}

    - name: Install or upgrade Zulip chart
      ansible.builtin.command: >
        helm upgrade --install {{ release_name }} {{ zulip_chart_dir }}
        --namespace {{ zulip_k8s_namespace }}
        --kubeconfig {{ kubeconfig_path }}
        {% if zulip_values_file | length > 0 %}-f {{ zulip_values_file }}{% endif %}
        {% if zulip_secret_values_file | length > 0 %}-f {{ zulip_secret_values_file }}{% endif %}
