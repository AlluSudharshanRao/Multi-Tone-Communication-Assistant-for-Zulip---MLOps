# Reference Prometheus alerting rules for tone classifier + generator (serving metrics).
# Used by: docker compose --profile monitoring (see serving/prometheus.yml + docker-compose volume).
# Cluster: DevOps can copy this file into platform Prometheus rule_files (serving does not edit k8s/platform here).

groups:
  - name: serving_tone_services
    interval: 30s
    rules:
      - alert: ServingClassifierHighErrorRatio
        expr: |
          sum(rate(classifier_requests_total{status="error"}[5m]))
          / clamp_min(sum(rate(classifier_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
          component: serving
        annotations:
          summary: "Classifier error ratio > 5% (10m)"
          description: "Investigate classifier logs and recent deploys."

      - alert: ServingClassifierLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(classifier_latency_seconds_bucket[5m])) by (le)
          ) > 0.15
        for: 15m
        labels:
          severity: warning
          component: serving
        annotations:
          summary: "Classifier p95 latency > 150ms (15m)"
          description: "Check load, CPU limits, and model backend (pytorch/onnx)."

      - alert: ServingGeneratorHighErrorRatio
        expr: |
          sum(rate(generator_requests_total{status="error"}[5m]))
          / clamp_min(sum(rate(generator_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
          component: serving
        annotations:
          summary: "Generator error ratio > 5% (10m)"
          description: "Investigate generator and upstream classifier URL."

      - alert: ServingGeneratorLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(generator_latency_seconds_bucket[5m])) by (le)
          ) > 0.8
        for: 15m
        labels:
          severity: warning
          component: serving
        annotations:
          summary: "Generator p95 latency > 800ms (15m)"
          description: "Dummy CPU baseline may exceed SLO; GPU path or rollback."
