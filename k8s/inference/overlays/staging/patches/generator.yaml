apiVersion: apps/v1
kind: Deployment
metadata:
  name: tone-generator
spec:
  template:
    spec:
      containers:
        - name: tone-generator
          env:
            - name: CLASSIFIER_URL
              value: "http://classifier-pytorch-staging:8001"
            - name: DUMMY_MODE
              value: "true"
            - name: DEPLOYMENT_TIER
              value: "staging"
