# Canary: production-like configuration for automated gates before full prod traffic.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ml-serving
nameSuffix: -canary
labels:
  - pairs:
      app.kubernetes.io/part-of: tone-assistant
      app.kubernetes.io/component: inference
      tier: canary
    includeSelectors: true
resources:
  - ../../base
patches:
  - path: patches/classifier.yaml
  - path: patches/generator.yaml
