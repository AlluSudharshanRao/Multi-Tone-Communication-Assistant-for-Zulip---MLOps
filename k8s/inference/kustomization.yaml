# Tiered inference: staging / canary / prod (PyTorch + generator per tier) + optional backends.
# Apply: kubectl apply -k k8s/inference/
# Zulip or in-cluster clients: prefer http://tone-generator-prod:8010 (namespace ml-serving).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - overlays/staging
  - overlays/canary
  - overlays/prod
  - backends
