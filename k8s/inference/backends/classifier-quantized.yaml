# Tone Classifier — quantized backend (shared; not tier-multiplied).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier-quantized
  labels:
    app: classifier-quantized
    role: serving
    backend: quantized
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classifier-quantized
  template:
    metadata:
      labels:
        app: classifier-quantized
        role: serving
        backend: quantized
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: classifier-quantized
          image: ghcr.io/allusudharshanrao/mlops-serving-classifier:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: SERVING_BACKEND
              value: "quantized"
            - name: MODEL_PATH
              value: "distilbert-base-uncased"
            - name: ONNX_PATH
              value: "/app/model_cache/classifier.onnx"
            - name: DUMMY_MODE
              value: "true"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.ml-platform.svc.cluster.local:5000"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: classifier-quantized
  labels:
    app: classifier-quantized
spec:
  type: ClusterIP
  selector:
    app: classifier-quantized
  ports:
    - name: http
      port: 8001
      targetPort: http
