# Tone Classifier — ONNX backend (shared; not tier-multiplied).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier-onnx
  labels:
    app: classifier-onnx
    role: serving
    backend: onnx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classifier-onnx
  template:
    metadata:
      labels:
        app: classifier-onnx
        role: serving
        backend: onnx
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: classifier-onnx
          image: ghcr.io/allusudharshanrao/mlops-serving-classifier:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: SERVING_BACKEND
              value: "onnx"
            - name: MODEL_PATH
              value: "distilbert-base-uncased"
            - name: ONNX_PATH
              value: "/app/model_cache/classifier.onnx"
            - name: DUMMY_MODE
              value: "true"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.ml-platform.svc.cluster.local:5000"
          volumeMounts:
            - name: model-cache
              mountPath: /app/model_cache
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: model-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: classifier-onnx
  labels:
    app: classifier-onnx
spec:
  type: ClusterIP
  selector:
    app: classifier-onnx
  ports:
    - name: http
      port: 8001
      targetPort: http
