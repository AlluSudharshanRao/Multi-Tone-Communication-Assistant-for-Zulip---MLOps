# Classifier Training Job — fine-tunes DistilBERT on GYAFC + Stanford Politeness Corpus.
# Owned by: Data / Training Engineer role.
# Dockerfile: teammate repo (see k8s/containers-matrix.md)
# Namespace: ml-training  (provisioned in k8s/base/namespaces.yaml)
#
# This is a Kubernetes Job (run-to-completion), not a long-running Deployment.
# Triggered manually or by CI/CD on new data or drift detection.
# Logs metrics and model artefacts to MLflow (ml-platform namespace).
# Saves model weights under MinIO bucket zulip-rewriter (aligned with data stack; prefix e.g. classifier/).
# Pulls the latest batch manifest plus optional feedback artifacts, materializes
# a training bundle, then trains from that manifest-backed dataset.
#
# Apply: kubectl apply -f k8s/training/classifier-training-job.yaml
# Monitor: kubectl logs -n ml-training -l job-name=classifier-training -f
---
apiVersion: batch/v1
kind: Job
metadata:
  name: classifier-training
  namespace: ml-training
  labels:
    app: classifier-training
    role: training
    model: distilbert
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 21600
  template:
    metadata:
      labels:
        app: classifier-training
        role: training
        model: distilbert
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: pull-datasets
          image: minio/mc:RELEASE.2025-02-21T16-00-46Z
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ENDPOINT
              value: "http://minio.ml-platform.svc.cluster.local:9000"
            - name: MINIO_BUCKET
              value: "zulip-rewriter"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
          command:
            - sh
            - -c
            - |
              set -eu
              TRIES=0
              MAX=24
              until mc alias set platform "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" >/dev/null 2>&1; do
                TRIES=$((TRIES+1))
                if [ "$TRIES" -ge "$MAX" ]; then
                  echo "ERROR: MinIO not reachable after $((MAX*5))s"
                  exit 1
                fi
                echo "MinIO not ready ($TRIES/$MAX), sleeping 5s..."
                sleep 5
              done
              mc ls "platform/$MINIO_BUCKET" >/dev/null
              mkdir -p /data/raw /data/batch/latest /data/feedback
              mc cp --recursive "platform/$MINIO_BUCKET/raw/" /data/raw/ || true
              mc cp --recursive "platform/$MINIO_BUCKET/batch/" /data/batch/ || true
              mc cp --recursive "platform/$MINIO_BUCKET/feedback/" /data/feedback/ || true
          volumeMounts:
            - name: training-data
              mountPath: /data
      containers:
        - name: classifier-training
          image: ghcr.io/allusudharshanrao/mlops-training-classifier:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.ml-platform.svc.cluster.local:5000"
            - name: MLFLOW_EXPERIMENT_NAME
              value: "teamchat_tone_clf"
            - name: MINIO_ENDPOINT
              value: "minio.ml-platform.svc.cluster.local:9000"
            - name: MINIO_BUCKET
              value: "zulip-rewriter"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.ml-platform.svc.cluster.local:9000"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: DATA_PATH
              value: "/data"
            - name: OUTPUT_PATH
              value: "/output"
            - name: DATASET_MANIFEST_PATH
              value: "/output/training_data/dataset_manifest.json"
            # Training hyperparameters — override via env or configmap as needed.
            - name: NUM_EPOCHS
              value: "5"
            - name: BATCH_SIZE
              value: "32"
            - name: LEARNING_RATE
              value: "2e-5"
            - name: F1_THRESHOLD
              value: "0.85"
          command:
            - sh
            - -lc
            - |
              set -eu
              python -c "import boto3" >/dev/null 2>&1 || python -m pip install --no-cache-dir boto3
              python /app/prepare_training_data.py \
                --batch-root /data/batch/latest \
                --feedback-dir /data/feedback \
                --output-dir /output/training_data
              python /app/train.py --config /app/configs/candidate_tone_distilbert.yaml
          volumeMounts:
            - name: training-data
              mountPath: /data
            - name: output
              mountPath: /output
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
      volumes:
        - name: training-data
          emptyDir: {}
        - name: output
          emptyDir: {}
