# Generator Fine-Tuning Job — instruction-tunes LLM for tone-conditioned rewriting.
# Owned by: Data / Training Engineer role.
# Dockerfile: teammate repo (see k8s/containers-matrix.md)
# Namespace: ml-training  (provisioned in k8s/base/namespaces.yaml)
#
# Kubernetes Job (run-to-completion). Heavier than classifier training;
# GPU strongly recommended for reasonable wall-clock time.
# Current manifest runs CPU-only (KVM@TACC node has no GPU).
# GPU path: uncomment nvidia.com/gpu block + runtimeClassName.
#
# Apply: kubectl apply -f k8s/training/generator-training-job.yaml
# Monitor: kubectl logs -n ml-training -l job-name=generator-training -f
---
apiVersion: batch/v1
kind: Job
metadata:
  name: generator-training
  namespace: ml-training
  labels:
    app: generator-training
    role: training
    model: llm-generator
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 21600
  template:
    metadata:
      labels:
        app: generator-training
        role: training
        model: llm-generator
    spec:
      restartPolicy: OnFailure
      # runtimeClassName: nvidia   # Uncomment for GPU node
      nodeName: mlops-proj15
      hostNetwork: true
      dnsPolicy: Default
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: pull-datasets
          image: minio/mc:RELEASE.2025-02-21T16-00-46Z
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ENDPOINT
              value: "http://129.114.27.192:30900"
            - name: MINIO_BUCKET
              value: "zulip-rewriter"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
          command:
            - sh
            - -c
            - |
              set -eu
              TRIES=0; MAX=24
              until wget -q --spider --timeout=5 "${MINIO_ENDPOINT}/minio/health/ready" 2>/dev/null; do
                TRIES=$((TRIES+1))
                if [ "$TRIES" -ge "$MAX" ]; then
                  echo "ERROR: MinIO not healthy after $((MAX*5))s"; exit 1
                fi
                echo "MinIO not ready ($TRIES/$MAX), sleeping 5s..."; sleep 5
              done
              mc alias set platform "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
              mc ls "platform/$MINIO_BUCKET" >/dev/null
              mc cp --recursive "platform/$MINIO_BUCKET/datasets/" /data/ || true
          volumeMounts:
            - name: training-data
              mountPath: /data
      containers:
        - name: generator-training
          image: ghcr.io/allusudharshanrao/mlops-training-generator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://129.114.27.192:30500"
            - name: MLFLOW_EXPERIMENT_NAME
              value: "teamchat_tone_generator_llm"
            - name: MINIO_ENDPOINT
              value: "129.114.27.192:30900"
            - name: MINIO_BUCKET
              value: "zulip-rewriter"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://129.114.27.192:30900"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_S3_FORCE_PATH_STYLE
              value: "true"
            - name: DEVICE
              value: "cpu"   # Change to "cuda" for GPU node
            - name: NUM_EPOCHS
              value: "3"
            - name: BATCH_SIZE
              value: "8"
          volumeMounts:
            - name: training-data
              mountPath: /data
            - name: output
              mountPath: /output
          resources:
            # CPU-only baseline. Swap in GPU block below for Blazar reservation.
            requests:
              cpu: "1"
              # Low request helps scheduling on 32Gi nodes; limit still allows LLM fine-tune heap spikes.
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
            # --- GPU block ---
            # requests:
            #   cpu: "4"
            #   memory: "16Gi"
            #   nvidia.com/gpu: "1"
            # limits:
            #   cpu: "8"
            #   memory: "32Gi"
            #   nvidia.com/gpu: "1"
      volumes:
        - name: training-data
          emptyDir: {}
        - name: output
          emptyDir: {}
