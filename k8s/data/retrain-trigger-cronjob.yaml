# Daily retraining trigger — runs retrain_trigger.py which evaluates:
#   DATA_TRIGGER:    >= 500 new feedback entries since last retrain
#   QUALITY_TRIGGER: rolling 7-day approval rate (thumbs_up/total) < 0.70
#   DRIFT_TRIGGER:   production MLflow F1 < 0.60
#
# If any condition fires:
#   - Writes triggers/YYYY-MM-DD/trigger_<ts>.json to MinIO
#   - Exits with code 10
#   - GitHub Actions retrain-on-trigger.yml detects the trigger record and
#     applies k8s/training/ + k8s/training/register-bundle/ (no kubectl needed here)
#
# Tune thresholds via env vars without rebuilding:
#   DATA_TRIGGER_COUNT, QUALITY_THRESHOLD, DRIFT_THRESHOLD, LOOKBACK_DAYS
#   DRY_RUN=true for smoke-testing the script without actually writing a trigger.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retrain-trigger
  namespace: ml-data
  labels:
    app: retrain-trigger
    role: data
spec:
  # Run at 02:00 UTC daily (after batch pipeline at 01:00, before team stand-up)
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: retrain-trigger
            role: data
        spec:
          restartPolicy: Never
          containers:
            - name: retrain-trigger
              image: ghcr.io/allusudharshanrao/mlops-data-batch:latest
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /app/retrain_trigger/retrain_trigger.py
              env:
                - name: MINIO_ENDPOINT
                  value: "http://minio.ml-platform.svc.cluster.local:9000"
                - name: MINIO_BUCKET
                  value: "zulip-rewriter"
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-root
                      key: root-user
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-root
                      key: root-password
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow.ml-platform.svc.cluster.local:5000"
                # Trigger thresholds (tune without rebuilding image)
                - name: DATA_TRIGGER_COUNT
                  value: "500"
                - name: QUALITY_THRESHOLD
                  value: "0.70"
                - name: DRIFT_THRESHOLD
                  value: "0.60"
                - name: LOOKBACK_DAYS
                  value: "7"
                - name: DRY_RUN
                  value: "false"
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
