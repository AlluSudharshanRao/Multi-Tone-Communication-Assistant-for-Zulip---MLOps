# MLflow tracking server (shared experiment UI + SQLite backend on PVC).
# Image pin: align with course/lab expectations; bump only after smoke-testing.
# Apply: kubectl apply -k k8s/platform/mlflow/ (or Ansible deploy_platform).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-platform
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
      # MLflow UI does not expose Prometheus /metrics on :5000 — do not annotate for pod scrape
      # (Prometheus would 404). Use mlflow-export or a sidecar if you need MLflow metrics later.
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.14.3
          args:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            # SQLite on PVC — sufficient for class scale; use Postgres for multi-replica.
            - --backend-store-uri=sqlite:////mlflow/data/mlflow.db
            - --default-artifact-root=/mlflow/data/artifacts
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: data
              mountPath: /mlflow/data
          resources:
            requests:
              cpu: "200m"
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
